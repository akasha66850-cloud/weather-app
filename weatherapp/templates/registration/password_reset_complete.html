{% extends "registration/base_auth.html" %}
{% block title %}Password reset successful – WeatherSense{% endblock %}

{% block card_content %}

<h1 class="auth-title">Password updated</h1>
<p style="font-size:.9rem;color:#4b5563;line-height:1.5;margin-bottom:24px">

</p>
<a href="{% url 'account_login' %}" class="btn btn-primary" style="text-decoration:none;">Sign in</a>
{% endblock %}
